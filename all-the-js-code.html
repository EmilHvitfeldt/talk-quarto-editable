<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script type="text/javascript">
(function () {
  'use strict';

  // ── Cursor factory ────────────────────────────────────────────────────────

  function makeCursor(id, name, color) {
    const el = document.createElement('div');
    el.id = id;
    el.className = 'collab-cursor-node';
    el.innerHTML = `
      <svg width="28" height="34" viewBox="0 0 11 14" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));flex-shrink:0">
        <path d="M0 0 L0 12 L3.2 8.8 L5.4 14 L7.2 13.3 L5 7.8 L9 7.8 Z"
              fill="${color}" stroke="white" stroke-width=".7" stroke-linejoin="round"/>
      </svg>
      <span style="
        background:${color};color:#fff;
        font:700 11px/1 -apple-system,sans-serif;
        padding:3px 8px;border-radius:0 4px 4px 4px;
        margin-top:16px;margin-left:1px;
        white-space:nowrap;
        box-shadow:0 1px 4px rgba(0,0,0,.25);
      ">${name}</span>
    `;
    return el;
  }

  // ── Coordinate helper ─────────────────────────────────────────────────────

  function posIn(el, section) {
    const er = el.getBoundingClientRect();
    const sr = section.getBoundingClientRect();
    const sx = 1280 / sr.width;
    const sy = 720  / sr.height;
    return {
      x: (er.left - sr.left) * sx,
      y: (er.top  - sr.top)  * sy,
      w: er.width  * sx,
      h: er.height * sy,
    };
  }

  // ── State ─────────────────────────────────────────────────────────────────

  let running   = false;
  let loopTimer = null;
  let currentTl = null;
  let isShifted = false;

  function cleanHeader() {
    const h  = document.getElementById('cblock-header');
    const fh = document.getElementById('fe-header-text');
    if (h  && h.textContent.endsWith('|'))  h.textContent  = h.textContent.slice(0, -1);
    if (fh && fh.textContent.endsWith('|')) fh.textContent = fh.textContent.slice(0, -1);
  }

  function stopAnim(flyOut) {
    running = false;
    clearTimeout(loopTimer);
    if (currentTl) { currentTl.pause(); currentTl = null; }
    cleanHeader();
    const t = document.getElementById('cblock-text');
    const i = document.getElementById('cblock-img');
    if (t) anime.set(t, { translateY: 0, scale: 1 });
    if (i) anime.set(i, { width: '300px' });

    if (flyOut) {
      const cursors = ['cur-alice', 'cur-bob', 'cur-carol']
        .map(id => document.getElementById(id)).filter(Boolean);
      if (cursors.length) {
        anime({ targets: cursors, opacity: 0, translateY: '+=300',
                duration: 500, easing: 'easeInQuad' });
      }
    }
  }

  // ── Cursor appearance ─────────────────────────────────────────────────────

  function appearAnim() {
    const section = document.getElementById('collab-slide');
    if (!section) return;

    [
      { id: 'cur-alice', name: 'Kari',   color: '#e91e8c' },
      { id: 'cur-bob',   name: 'John',   color: '#1565c0' },
      { id: 'cur-carol', name: 'Hailey', color: '#f9a825' },
    ].forEach(({ id, name, color }) => {
      if (!document.getElementById(id)) section.appendChild(makeCursor(id, name, color));
    });

    const alice = document.getElementById('cur-alice');
    const bob   = document.getElementById('cur-bob');
    const carol = document.getElementById('cur-carol');
    const aliceIdle = isShifted ? { x: 1050, y: 430 } : { x: 120, y: 340 };
    const R = { x: 1100, y: 300 };
    const B = { x: 640,  y: 660 };

    anime.set(alice, { translateX: isShifted ? 1480 : -200, translateY: aliceIdle.y, opacity: 0 });
    anime.set(bob,   { translateX: 1480, translateY: R.y, opacity: 0 });
    anime.set(carol, { translateX:  640, translateY: 900, opacity: 0 });

    const entry = anime.timeline({ easing: 'easeOutCubic' });
    currentTl = entry;
    entry
      .add({ targets: alice, opacity: 1, translateX: aliceIdle.x, translateY: aliceIdle.y, duration: 700 }, 0)
      .add({ targets: bob,   opacity: 1, translateX: R.x, translateY: R.y, duration: 700 }, 150)
      .add({ targets: carol, opacity: 1, translateX: B.x, translateY: B.y, duration: 700 }, 300);
  }

  // ── Main animation loop ───────────────────────────────────────────────────

  function runAnim() {
    if (running) return;
    running = true;

    // Stop any in-progress animation (e.g. appearAnim's entry timeline)
    if (currentTl) { currentTl.pause(); currentTl = null; }

    const section = document.getElementById('collab-slide');
    if (!section) { running = false; return; }

    // Ensure cursors exist (e.g. when restarting after layout shift)
    [
      { id: 'cur-alice', name: 'Kari',   color: '#e91e8c' },
      { id: 'cur-bob',   name: 'John',   color: '#1565c0' },
      { id: 'cur-carol', name: 'Hailey', color: '#f9a825' },
    ].forEach(({ id, name, color }) => {
      if (!document.getElementById(id)) section.appendChild(makeCursor(id, name, color));
    });

    const alice = document.getElementById('cur-alice');
    const bob   = document.getElementById('cur-bob');
    const carol = document.getElementById('cur-carol');

    // Restore visibility and snap to idle positions in case shiftLayout interrupted the loop
    const aliceSnap = isShifted ? { x: 1050, y: 430 } : { x: 120, y: 340 };
    anime.set(alice, { opacity: 1, translateX: aliceSnap.x, translateY: aliceSnap.y });
    anime.set(bob,   { opacity: 1, translateX: 1100,        translateY: 300 });
    anime.set(carol, { opacity: 1, translateX: 640,         translateY: 660 });

    const textEl   = document.getElementById('cblock-text');
    const imgEl    = document.getElementById('cblock-img');
    const headerEl = document.getElementById('cblock-header');

    anime.set(textEl, { translateY: 0, scale: 1 });
    anime.set(imgEl,  { width: '300px' });

    const aliceIdle = isShifted ? { x: 1050, y: 430 } : { x: 120, y: 340 };

    const tp = posIn(textEl, section);
    const ip = posIn(imgEl,  section);

    // ip.w is the slide-coord width of the image at its initial CSS size (300px).
    // We use this ratio to convert CSS px deltas → slide coord deltas for cursor tracking.
    const INITIAL_IMG_CSS = 300; // matches .collab-image width in CSS
    const cssToSlide = ip.w / INITIAL_IMG_CSS;

    let textTY     = 0;
    let textTopCSS = 200; // tracked value shown in fe-text-top
    let imgCSS     = INITIAL_IMG_CSS; // tracked CSS width of imgEl

    const NUDGE  = 40;  // translateY px for text nudge
    const RESIZE = 120; // CSS px to grow/shrink the image

    const L = isShifted ? { x: 1050, y: 430 } : { x: 120, y: 340 };
    const R = { x: 1100, y: 300 };
    const B = { x: 640,  y: 660 };

    // ── addNudge ──────────────────────────────────────────────────────────────
    function addNudge(tl, startAt, cursor, el, elBasePos, currentTY, deltaTY, afterPos) {
      const grabX = elBasePos.x + elBasePos.w * 0.4;
      const grabY = elBasePos.y + currentTY + elBasePos.h * 0.4;

      tl.add({ targets: cursor, translateX: grabX, translateY: grabY,
               duration: 750, easing: 'easeInOutCubic' }, startAt);
      tl.add({ targets: el, scale: 1.02,
               duration: 140, easing: 'easeOutQuad' }, startAt + 750);
      tl.add({ targets: cursor, translateY: grabY + deltaTY,
               duration: 900, easing: 'easeInOutSine' }, startAt + 890);
      tl.add({ targets: el, translateY: currentTY + deltaTY,
               duration: 900, easing: 'easeInOutSine' }, startAt + 890);

      // sync fe-text-top when nudging the text element
      if (el === textEl) {
        const feTextTop  = document.getElementById('fe-text-top');
        const feLineText = document.getElementById('fe-line-text');
        const snapTop    = textTopCSS;
        const tState     = { n: snapTop };
        tl.add({ targets: tState, n: snapTop + deltaTY,
                 duration: 900, easing: 'easeInOutSine',
                 begin:    () => { feLineText && feLineText.classList.add('fe-line--active'); },
                 update:   () => { if (feTextTop) feTextTop.textContent = Math.round(tState.n); },
                 complete: () => { feLineText && feLineText.classList.remove('fe-line--active'); },
               }, startAt + 890);
        textTopCSS += deltaTY;
      }

      tl.add({ targets: el, scale: 1,
               duration: 220, easing: 'easeOutBounce' }, startAt + 1790);
      tl.add({ targets: cursor, translateX: afterPos.x, translateY: afterPos.y,
               duration: 600, easing: 'easeInOutQuad' }, startAt + 2010);

      return startAt + 2100;
    }

    // ── addResize ─────────────────────────────────────────────────────────────
    function addResize(tl, startAt, cursor, deltaCSSWidth, afterPos) {
      const edgeX = ip.x + imgCSS * cssToSlide;
      const edgeY = ip.y + ip.h * 0.5;
      const snapImgCSS = imgCSS;

      tl.add({ targets: cursor, translateX: edgeX, translateY: edgeY,
               duration: 750, easing: 'easeInOutCubic' }, startAt);
      tl.add({ targets: imgEl, width: (snapImgCSS + deltaCSSWidth) + 'px',
               duration: 1000, easing: 'easeInOutSine' }, startAt + 900);
      tl.add({ targets: cursor, translateX: edgeX + deltaCSSWidth * cssToSlide,
               duration: 1000, easing: 'easeInOutSine' }, startAt + 900);

      // sync editor width number
      const feImgWidth = document.getElementById('fe-img-width');
      const feLineImg  = document.getElementById('fe-line-img');
      if (feImgWidth) {
        const wState = { n: snapImgCSS };
        tl.add({ targets: wState, n: snapImgCSS + deltaCSSWidth,
                 duration: 1000, easing: 'easeInOutSine',
                 begin:    () => { feLineImg && feLineImg.classList.add('fe-line--active'); },
                 update:   () => { feImgWidth.textContent = Math.round(wState.n); },
                 complete: () => { feLineImg && feLineImg.classList.remove('fe-line--active'); },
               }, startAt + 900);
      }

      tl.add({ targets: cursor, translateX: afterPos.x, translateY: afterPos.y,
               duration: 600, easing: 'easeInOutQuad' }, startAt + 1900);

      imgCSS += deltaCSSWidth;
      return startAt + 2100;
    }

    // ── addTextEdit ───────────────────────────────────────────────────────────
    function addTextEdit(tl, startAt, cursor, fromText, toText, afterPos) {
      const hp = posIn(headerEl, section);
      const deleteMs = Math.max(fromText.length * 65, 200);
      const typeMs   = Math.max(toText.length   * 65, 200);

      tl.add({ targets: cursor, translateX: hp.x + 20, translateY: hp.y + hp.h * 0.5,
               duration: 750, easing: 'easeInOutCubic' }, startAt);

      const feHeaderText = document.getElementById('fe-header-text');
      const feLineHeader = document.getElementById('fe-line-header');

      // delete — updates slide header and editor in sync
      const del = { n: fromText.length };
      tl.add({ targets: del, n: 0, duration: deleteMs, easing: 'linear',
               begin:  () => { feLineHeader && feLineHeader.classList.add('fe-line--active'); },
               update: () => {
                 const t = fromText.slice(0, Math.round(del.n));
                 headerEl.textContent = t + '|';
                 if (feHeaderText) feHeaderText.textContent = t + '|';
               },
             }, startAt + 900);

      // type — updates slide header and editor in sync
      const typ = { n: 0 };
      tl.add({ targets: typ, n: toText.length, duration: typeMs, easing: 'linear',
               update: () => {
                 const t = toText.slice(0, Math.round(typ.n));
                 headerEl.textContent = t + '|';
                 if (feHeaderText) feHeaderText.textContent = t + '|';
               },
               complete: () => {
                 headerEl.textContent = toText;
                 if (feHeaderText) feHeaderText.textContent = toText;
                 feLineHeader && feLineHeader.classList.remove('fe-line--active');
               },
             }, startAt + 900 + deleteMs + 80);

      const done = startAt + 900 + deleteMs + 80 + typeMs;
      tl.add({ targets: cursor, translateX: afterPos.x, translateY: afterPos.y,
               duration: 600, easing: 'easeInOutQuad' }, done + 150);

      return done + 400;
    }

    const ORIGINAL_TEXT = headerEl.textContent;
    const TEXT_A = 'LIZARD LIZARD LIZARD';
    const TEXT_B = 'Lizard? Lizard? Lizard?';
    const TEXT_C = ORIGINAL_TEXT;

    doLoop();

    // ── Self-cancelling 7-move loop ───────────────────────────────────────────
    // Move 1: Alice nudges text up             → textTY = -NUDGE
    // Move 2: Bob   nudges text back down      → textTY = 0
    // Move 3: Carol drags image wider          → imgCSS += RESIZE
    // Move 4: Alice drags image back narrower  → imgCSS -= RESIZE
    // Move 5: Bob   types TEXT_A
    // Move 6: Carol types TEXT_B
    // Move 7: Alice types TEXT_C (original)    → header restored

    function doLoop() {
      if (!running) return;

      const tl = anime.timeline();
      currentTl = tl;
      let t = 100;

      t = addNudge(tl, t, alice, textEl, tp, textTY, -NUDGE, L); textTY -= NUDGE;
      t = addNudge(tl, t, bob,   textEl, tp, textTY, +NUDGE, R); textTY += NUDGE;
      t = addResize(tl, t, carol, +RESIZE, B);
      t = addResize(tl, t, alice, -RESIZE, L);
      t = addTextEdit(tl, t, bob,   TEXT_C, TEXT_A, R);
      t = addTextEdit(tl, t, carol, TEXT_A, TEXT_B, B);
      t = addTextEdit(tl, t, alice, TEXT_B, TEXT_C, L);

      tl.finished.then(() => {
        if (!running) return;
        loopTimer = setTimeout(doLoop, 300);
      });
    }
  }

  // ── Fragment shift ────────────────────────────────────────────────────────

  function shiftLayout(toRight) {
    isShifted = toRight;
    stopAnim();

    const cursors = ['cur-alice', 'cur-bob', 'cur-carol']
      .map(id => document.getElementById(id)).filter(Boolean);
    const scene  = document.querySelector('#collab-slide .collab-scene');
    const editor = document.getElementById('fake-editor');

    anime({
      targets: cursors, opacity: 0, duration: 250, easing: 'easeOutQuad',
      complete: () => {
        scene.classList.toggle('right-half', toRight);
        anime({ targets: editor, opacity: toRight ? 1 : 0,
                duration: 500, easing: 'easeOutQuad' });
        setTimeout(runAnim, 700);
      }
    });
  }

  // ── Stop loop only (keep cursors visible) ────────────────────────────────

  function stopLoop() {
    running = false;
    clearTimeout(loopTimer);
    if (currentTl) { currentTl.pause(); currentTl = null; }
    cleanHeader();
    const t = document.getElementById('cblock-text');
    const i = document.getElementById('cblock-img');
    if (t) anime.set(t, { translateY: 0, scale: 1 });
    if (i) anime.set(i, { width: '300px' });
  }

  // ── RevealJS wiring ───────────────────────────────────────────────────────

  function boot() {
    if (typeof Reveal === 'undefined' || !Reveal.isReady()) {
      return setTimeout(boot, 80);
    }
    Reveal.on('slidechanged', ({ currentSlide }) => {
      if (currentSlide && currentSlide.id === 'collab-slide') {
        // restore correct state on back-navigation
        const af = document.getElementById('appear-fragment');
        const sf = document.getElementById('start-fragment');
        const appeared = af && af.classList.contains('visible');
        const started  = sf && sf.classList.contains('visible');
        if (started)       runAnim();
        else if (appeared) appearAnim();
      } else {
        stopAnim();
      }
    });
    Reveal.on('fragmentshown', ({ fragment }) => {
      if (fragment.id === 'appear-fragment') appearAnim();
      if (fragment.id === 'start-fragment')  runAnim();
      if (fragment.id === 'layout-fragment') shiftLayout(true);
    });
    Reveal.on('fragmenthidden', ({ fragment }) => {
      if (fragment.id === 'start-fragment')  stopLoop();   // cursors stay, loop stops
      if (fragment.id === 'appear-fragment') stopAnim(true); // cursors fly out
      if (fragment.id === 'layout-fragment') shiftLayout(false);
    });
    const cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
    if (cur && cur.id === 'collab-slide') {
      const af = document.getElementById('appear-fragment');
      const sf = document.getElementById('start-fragment');
      if (sf && sf.classList.contains('visible'))       runAnim();
      else if (af && af.classList.contains('visible'))  appearAnim();
    }
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
